<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f4" />
    <title>LOOPEC — You’re offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f6f4; color: #292530; font: 16px/1.7 Arial, Helvetica, sans-serif; }
      main { max-width: 460px; padding: 38px; border: 1px solid #e8e3ed; border-radius: 22px; background: #fffefd; }
      .mark { display: grid; place-items: center; width: 43px; height: 43px; margin-bottom: 25px; border-radius: 14px; background: #eeeaf7; color: #49347f; font-size: 21px; }
      p { color: #77717e; font-size: 14px; }
      a { display: inline-flex; margin-top: 12px; padding: 11px 17px; border-radius: 999px; background: #49347f; color: white; font-size: 13px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↻</div>
      <h1>You’re out of the loop for a moment.</h1>
      <p>LOOPEC needs an internet connection to load the latest campus marketplace. Check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
